# Paste into your server{} block.
#
# proxy_read_timeout must stay well above one analysis. ~25 s is typical and a queued
# request waits behind those ahead of it; the nginx default of 60 s returns 504 for work
# that is proceeding normally. Use POST /jobs for anything bulk -- it returns in ~40 ms
# and no timeout applies.
location /cysts/ {
    proxy_pass         http://127.0.0.1:8089/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    client_max_body_size 64m;
}

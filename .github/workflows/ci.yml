name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      # the analysis and contract tests must run without the 3 GB GPU stack,
      # which is why torch/nnunet/TotalSegmentator are an optional extra
      - run: pip install -e ".[dev]"
      - run: ruff check cysts app.py
      - run: pytest -q
